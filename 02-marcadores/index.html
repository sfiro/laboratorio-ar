<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AR · Nivel 2 · Marcadores</title>
  <link rel="stylesheet" href="./escena.css" />
  <!-- Orden importante: A-Frame → AR.js → nuestros componentes → la escena -->
  <script src="./vendor/aframe.min.js"></script>
  <script src="./vendor/aframe-ar.js"></script>
  <script src="./componentes.js"></script>
</head>
<body>
  <header class="hud-arriba">
    <a class="volver" href="../">← Laboratorio</a>
    <div class="chips">
      <span class="chip" data-marcador="hiro">Hiro</span>
      <span class="chip" data-marcador="estrella">Estrella</span>
      <span class="chip" data-marcador="escalera">Escalera</span>
    </div>
  </header>

  <footer class="hud-abajo">
    <p id="info">Apunta la cámara a un marcador. Toca la pantalla para interactuar.</p>
    <a class="btn" href="./marcadores.html">Ver e imprimir marcadores</a>
  </footer>

  <!--
    arjs: AR.js toma la cámara y busca marcadores en cada cuadro.
    - cameraParametersUrl: la "lente" de una cámara típica (para calcular la perspectiva)
    - patternRatio: qué parte del cuadrado negro es dibujo interior (0.5 = la mitad)
    Unidades: 1 = el ancho del marcador. Y sale perpendicular al papel.
  -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; colorManagement: true; antialias: true"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; patternRatio: 0.5; cameraParametersUrl: ./data/camera_para.dat"
    tocar-pantalla
    estado-marcadores
  >
    <a-assets>
      <a-asset-item id="modelo-cohete" src="./modelos/cohete.glb"></a-asset-item>
    </a-assets>

    <!-- Hiro: el cohete del nivel 1. Al tocar, despega. -->
    <a-marker id="hiro" type="pattern" url="./data/patt.hiro" emitevents="true"
              smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">
      <a-entity gltf-model="#modelo-cohete" scale="1.6 1.6 1.6"
        animation__subir="property: position; from: 0 0 0; to: 0 2.5 0; dur: 1100; easing: easeInQuad; startEvents: tocar"
        animation__bajar="property: position; from: 0 2.5 0; to: 0 0 0; dur: 1300; delay: 1300; easing: easeOutElastic; startEvents: tocar"
        animation__giro="property: rotation; from: 0 0 0; to: 0 360 0; dur: 2400; easing: easeInOutSine; startEvents: tocar">
      </a-entity>
    </a-marker>

    <!-- Estrella: un cubo que gira. Al tocar, cambia de color y salta. -->
    <a-marker id="estrella" type="pattern" url="./data/patt.estrella" emitevents="true"
              smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">
      <a-box position="0 0.5 0" depth="0.8" height="0.8" width="0.8"
        material="color: #4fe3c1; roughness: 0.3; metalness: 0.1"
        colores="#4fe3c1, #f2c230, #ff6b8a, #8fb3ff, #b48cff"
        animation__girar="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear"
        animation__saltar="property: position; from: 0 0.5 0; to: 0 1.3 0; dur: 300; dir: alternate; loop: 2; easing: easeOutQuad; startEvents: tocar">
      </a-box>
      <a-cylinder position="0 0.01 0" radius="0.6" height="0.02" material="color: #000; opacity: 0.25; transparent: true"></a-cylinder>
    </a-marker>

    <!-- Escalera: los ejes del marcador. Muestra distancia e inclinación. Al tocar, muestra el "cubo unidad". -->
    <a-marker id="escalera" type="pattern" url="./data/patt.escalera" emitevents="true"
              smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2" medir>
      <a-cylinder position="0.5 0 0" rotation="0 0 90" radius="0.03" height="1" color="#ff4d5a"></a-cylinder>
      <a-cone position="1.05 0 0" rotation="0 0 -90" radius-bottom="0.07" height="0.15" color="#ff4d5a"></a-cone>
      <a-cylinder position="0 0.5 0" radius="0.03" height="1" color="#3ddc84"></a-cylinder>
      <a-cone position="0 1.05 0" radius-bottom="0.07" height="0.15" color="#3ddc84"></a-cone>
      <a-cylinder position="0 0 0.5" rotation="90 0 0" radius="0.03" height="1" color="#4f8cff"></a-cylinder>
      <a-cone position="0 0 1.05" rotation="90 0 0" radius-bottom="0.07" height="0.15" color="#4f8cff"></a-cone>
      <a-sphere radius="0.07" color="#fff"></a-sphere>
      <a-box id="cubo-unidad" position="0 0.5 0" width="1" height="1" depth="1" visible="false"
        material="color: #fff; wireframe: true"></a-box>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
