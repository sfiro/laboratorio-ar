# Publica todos los niveles en GitHub Pages cada vez que se sube un cambio a main.
# Resultado: https://<usuario>.github.io/<repo>/00-taller/, /01-model-viewer/, ...
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Construir cada nivel
        run: |
          mkdir -p _site
          cp index.html guia.html _site/
          for dir in [0-9][0-9]-*/; do
            dir="${dir%/}"
            [ -f "$dir/package.json" ] || continue
            echo "Construyendo $dir"
            (cd "$dir" && npm ci && npm run build -- --outDir "../_site/$dir" --emptyOutDir)
          done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
